<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Salma Soofiyan - Cybersecurity, AI and Smart Contract Security</title>
  <desc id="desc">A dark blue technology banner with a glowing security shield and circuit pattern.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102A4C"/>
      <stop offset="1" stop-color="#241B52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35E0FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35E0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#35E0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9DD9FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="188" cy="180" r="170" fill="url(#halo)"/>
  <circle cx="1070" cy="70" r="190" fill="#8B5CF6" opacity="0.07"/>

  <!-- Circuit traces -->
  <g fill="none" stroke="#58D8FF" stroke-width="2" stroke-linecap="round" opacity="0.42">
    <path d="M0 86H88L124 122H174"/>
    <path d="M0 276H78L116 238H171"/>
    <path d="M224 36V82L255 113"/>
    <path d="M1200 96H1090L1050 136H982"/>
    <path d="M1200 286H1082L1040 244H970"/>
    <path d="M934 0V48L905 77"/>
  </g>
  <g fill="#66E3FF" opacity="0.72">
    <circle cx="88" cy="86" r="4"/><circle cx="78" cy="276" r="4"/><circle cx="224" cy="82" r="4"/>
    <circle cx="1090" cy="96" r="4"/><circle cx="1082" cy="286" r="4"/><circle cx="934" cy="48" r="4"/>
  </g>

  <!-- Security shield -->
  <g transform="translate(78 70)" filter="url(#glow)">
    <path d="M108 0L202 34V103C202 164 164 208 108 232C52 208 14 164 14 103V34Z" fill="#0A1D36" stroke="url(#accent)" stroke-width="5"/>
    <path d="M108 22L179 48V103C179 147 153 181 108 204C63 181 37 147 37 103V48Z" fill="none" stroke="#9EEBFF" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="108" cy="102" r="36" fill="none" stroke="#35E0FF" stroke-width="4"/>
    <path d="M108 78V126M84 102H132" stroke="#35E0FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="108" cy="102" r="8" fill="#8B5CF6"/>
    <path d="M108 56V36M72 67L57 52M144 67L159 52M72 137L57 152M144 137L159 152" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Main copy -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="360" y="112" fill="#73E7FF" font-size="18" font-weight="700" letter-spacing="4">CYBERSECURITY • AI • BLOCKCHAIN</text>
    <text x="356" y="182" fill="#FFFFFF" font-size="54" font-weight="800" letter-spacing="1">SALMA SOOFIYAN</text>
    <rect x="360" y="205" width="156" height="4" rx="2" fill="url(#accent)"/>
    <text x="360" y="252" fill="#D7E7F7" font-size="24" font-weight="500">AI &amp; Machine Learning Researcher · Lecturer</text>
    <text x="360" y="292" fill="#9FB8D1" font-size="19">Smart Contract Security · Vulnerability Detection · Trustworthy Systems</text>
  </g>

  <rect x="2" y="2" width="1196" height="356" rx="26" fill="none" stroke="#73E7FF" stroke-opacity="0.2" stroke-width="2"/>
</svg>
